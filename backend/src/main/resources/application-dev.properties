# =============================================================================
# EventEase Backend - Development / Standalone Demo Profile
# Uses file-persisted H2 database running in MySQL 8 compatibility mode.
# Enables full functionality (tables, constraints, BCrypt auth, data persistence)
# when an external MySQL 8 daemon is not running on the local system.
# =============================================================================

spring.datasource.url=jdbc:h2:file:./data/eventease_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8080/h2-console in dev profile)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
