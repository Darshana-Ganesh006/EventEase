# =============================================================================
# EventEase Backend Configuration
# Course: 21CSE354T - Full Stack Web Development
# SRM Institute of Science and Technology, Tiruchirappalli Campus
# =============================================================================

server.port=${SERVER_PORT:8080}
spring.application.name=eventease-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# -----------------------------------------------------------------------------
# Database Configuration (MySQL 8.x)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eventease_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate (Dialect is automatically resolved by Hibernate 6)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------------
# Security & JWT Token Settings
# -----------------------------------------------------------------------------
eventease.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
eventease.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -----------------------------------------------------------------------------
# Microservice Integrations
# -----------------------------------------------------------------------------
eventease.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}

# CORS Configuration
eventease.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging
logging.level.com.eventease=INFO
logging.level.org.springframework.security=WARN
